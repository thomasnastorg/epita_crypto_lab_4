# nginx in front of the internal API, for https://www.lab.internal
# After any change:  docker compose restart nginx   (and read: docker compose logs nginx)
#
# Inside the container:
#   /etc/nginx/tls   = identities/www     (the server's key and certificate)
#   /etc/nginx/ca    = intermediate/certs (CA certificates)
#   /etc/nginx/crl   = intermediate/crl   (CRLs)

server {
    listen 443 ssl;
    server_name www.lab.internal;

    # Phase 3: the server's certificate chain (leaf, then intermediate) and its key
    ssl_certificate     /etc/nginx/tls/www.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/www.key.pem;

    # Phase 4: mutual TLS. Uncomment and complete.
    ssl_client_certificate /etc/nginx/ca/ca-chain.pem;   # the CA certificates a client certificate must chain to
    ssl_verify_client on;
    ssl_verify_depth 2;

    # Phase 5: revocation. Uncomment and complete.
    # ssl_crl /etc/nginx/crl/TODO;

    location / {
        proxy_pass http://api:8080;
        # The API trusts these two headers to know who is calling
        proxy_set_header X-Client-Verify $ssl_client_verify;   # SUCCESS when the client certificate is valid
        proxy_set_header X-Client-DN     $ssl_client_s_dn;     # its subject, for example CN=alice,O=EPITA Lab
    }
}
